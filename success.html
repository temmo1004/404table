<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #F5F2EC; color: #0A0A0A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    padding: 24px;
  }
  .card {
    background: #fff; max-width: 520px; width: 100%;
    border: 1px solid #0A0A0A; padding: 48px 32px; text-align: center;
  }
  .check { font-size: 80px; color: #FF3B00; line-height: 1; margin-bottom: 16px; }
  h1 { font-size: 28px; margin: 0 0 12px; letter-spacing: 0.02em; }
  p { font-size: 15px; line-height: 1.7; color: #333; margin: 0 0 12px; }
  .meta { color: #666; font-size: 13px; margin-top: 24px; }
  .meta code { background: #f3ede2; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
  a.btn {
    display: inline-block; margin-top: 24px; padding: 12px 28px;
    background: #0A0A0A; color: #F5F2EC; text-decoration: none; font-weight: 600;
    border-radius: 3px;
  }
  a.btn:hover { background: #FF3B00; }
</style>

<body>
<main class="card">
  <div class="check">✓</div>
  <h1>付款完成</h1>
  <p>感謝你報名 404 TABLE！<br/>我們會在 <strong>24 小時內</strong>透過 Email 聯繫你，<br/>確認上課場次（台北 / 台中 / 高雄 / 線上）。</p>
  <p>發票將開立至你付款時填寫的 Email。<br/>有任何問題請來信 <a href="mailto:support@404table.com">support@404table.com</a>。</p>
  <a class="btn" href="/">← 回首頁</a>
  <p class="meta">訂單編號：<code id="session-id">—</code></p>
</main>
<script>
  // Extract session ID
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id') || params.get('order_id') || '';
  if (sessionId) {
    document.getElementById('session-id').textContent = sessionId;
  }

  // Fire Purchase conversion events (de-duped by sessionId to avoid double-count on refresh)
  const fired = sessionStorage.getItem('purchase_fired_' + sessionId);
  if (!fired && sessionId) {
    sessionStorage.setItem('purchase_fired_' + sessionId, '1');

    // Meta Pixel Purchase
    if (window.fbq) {
      fbq('track', 'Purchase', {
        value: 500,
        currency: 'TWD',
        content_name: '404 TABLE 1堂課',
        content_ids: ['course-1class'],
        content_type: 'product',
      });
    }

    // GA4 purchase
    if (window.gtag) {
      gtag('event', 'purchase', {
        transaction_id: sessionId,
        value: 500,
        currency: 'TWD',
        items: [{
          item_id: 'course-1class',
          item_name: '404 TABLE 1堂課',
          price: 500,
          quantity: 1,
        }],
      });
    }
  }
</script>
</body>
